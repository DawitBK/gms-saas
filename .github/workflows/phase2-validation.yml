name: GMS CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap and first: refuse a PR that git-tracks a real .env. Committing one
  # publishes the production database password and both JWT secrets, and
  # `git rm --cached` afterwards does not remove it from history.
  env-files:
    name: No tracked env files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node tools/check-tracked-env-files.js

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx tsc --noEmit
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: gms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: change-me-dev-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d gms_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      # 7200/7201 are GMS's real ports in BOTH dev and production. This block
      # said PORT: 5001 — not merely the pre-7xxx scheme, but the old FRONTEND
      # port, on the backend. Harmless in practice (the suite drives the app
      # through supertest rather than a listening socket) and wrong to leave
      # sitting in the file people copy from.
      PORT: 7200
      HOST: 127.0.0.1
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: change-me-dev-password
      DB_NAME: gms_test
      JWT_SECRET: ci-test-secret-that-is-at-least-32-chars
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-chars-long
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FROM_EMAIL: no-reply@test.local
      CLIENT_URL: http://localhost:7201
      CORS_ALLOWED_ORIGINS: http://localhost:7201
      RATE_LIMIT_GLOBAL_MAX: 100000
      RATE_LIMIT_AUTH_MAX: 100000
      RATE_LIMIT_CRITICAL_MAX: 100000
      SENTRY_TRACES_SAMPLE_RATE: 0
      METRICS_ENABLED: false
      ENABLE_QUEUE_WORKERS: false
      ENABLE_OUTBOX_POLLING: false
      ENABLE_UNIFI_ACCESS_POLLING: false
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - name: Run DB migrations
        working-directory: backend
        run: node scripts/run-sequelize-cli.js test db:migrate
      - name: Seed test DB
        working-directory: backend
        run: node scripts/run-sequelize-cli.js test db:seed --seed 000-core-seeder.js
      - run: npm test -- --runInBand
        working-directory: backend
      - run: npm run test:status
      - run: git diff --exit-code -- docs/TEST_STATUS.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

  # This job used to run `node --test ./tests/sample.test.mjs`. That file was
  # deleted on 2026-07-12 (commit 60c7d4f) and never replaced, so the job failed
  # on every push and PR for two months. Rather than resurrect a placeholder,
  # it now runs the two checks that actually catch frontend breakage: lint and a
  # real production build (which resolves every import, enforces the server /
  # client component boundary, and pre-renders every static route).
  frontend:
    name: Frontend Lint + Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  openapi:
    name: OpenAPI Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # Reads the spec the app actually serves (src/api/swagger.ts). It used to
      # read docs/api/openapi.json, deleted in the same commit as the frontend
      # sanity test, so this job threw ENOENT for two months — which also meant
      # docker-build below, which needs it, never ran on main.
      - run: node scripts/validate-openapi-coverage.js
        working-directory: backend

  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [test, openapi, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t gms-backend:ci ./backend
      - name: Build frontend image
        # Build args are only a smoke test that the image builds; they are not
        # the deployed values. They were 5000/3000 — the pre-7xxx scheme.
        # All three are load-bearing: NEXT_PUBLIC_APP_URL is read by
        # shared/lib/{qr-links,runtime-origin,site-config}.ts and is required by
        # scripts/check-env-presence.js.
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:7200/api/v1 \
            --build-arg NEXT_PUBLIC_SOCKET_URL=http://localhost:7200 \
            --build-arg NEXT_PUBLIC_APP_URL=http://localhost:7201 \
            -t gms-frontend:ci ./frontend
